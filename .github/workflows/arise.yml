name: Arise

# A push to a PR branch used to start the whole pipeline twice — once for the
# push and once for the pull_request — because both triggers matched every
# path. Pushes are now watched on the default branch only; PR branches are
# covered by the pull_request trigger.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # -- Evidence smoke gate ------------------------------------------------
      # The benchmarks are the only thing that exercises the study/evidence
      # code paths (type-check covers only src/** and scripts/**, with checkJs
      # off). Run every deterministic one on every push so a broken line in
      # benchmark/ fails CI instead of rotting until real data arrives.
      - name: Smoke gate - verify (lint, types, tests, build)
        run: npm run verify
      - name: Smoke gate - validate + backtest
        run: npm run benchmark
      - name: Smoke gate - comparative study harness
        run: npm run benchmark:study
      - name: Smoke gate - field-study pipeline (fixture mode, synthetic data)
        run: npm run benchmark:field:fixture
      - name: Smoke gate - logging-time metric
        run: npm run benchmark:logging
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright E2E
        run: npx playwright test --reporter=list
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
