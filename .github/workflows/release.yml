name: Release

# Release automation: cutting a version is one tag push. Semantic version,
# changelog, artifacts and a GitHub Release fall out of the tag — no local
# ceremony, no forgotten changelog entries.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Version discipline: the tag MUST match package.json's version (the gate
# below enforces it), so a release is always exactly what was verified in CI
# on the tagged commit.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tag commit belongs to main
        run: |
          git fetch origin main --force
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag commit $GITHUB_SHA is not on origin/main"
            exit 1
          fi
      - name: Tag commit passed main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list --workflow Arise --branch main --event push --commit "$GITHUB_SHA" --limit 1 --json databaseId,status,conclusion --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' | head -n1)"
          if [ -z "$RUN_ID" ]; then
            echo "::error::no successful main Arise workflow found for $GITHUB_SHA"
            exit 1
          fi
          echo "verified main CI run: $RUN_ID"
      - name: Tag matches package.json version (semver gate)
        id: v
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG != package.json $PKG — bump package.json in the tagged commit"
            exit 1
          fi
          if ! echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not valid semver"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  license-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Every production dependency's license must be on the allowlist — the
      # app ships to end users; copyleft-or-worse in the bundle is a legal
      # problem discovered far too late otherwise.
      - name: Production license allowlist
        run: node scripts/license-check.cjs

  build-and-release:
    needs: [validate-tag, license-compliance]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Production deploy gate: a tag never ships on an unverified commit.
      # The same verify pipeline PRs run, re-run on the tagged ref.
      - name: Verify (lint, types, tests, build)
        run: npm run verify
      - name: Benchmark gates
        run: npm run benchmark
      - name: Dependency audit (prod, high+)
        run: npm run audit:deps
      - name: Bundle size budget
        run: npm run bundle:budget
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Full Playwright E2E
        run: npm run e2e:ci
      - name: Production PWA E2E
        run: npm run e2e:pwa -- --reporter=list

      - name: Build production bundle
        run: npm run build
      - name: Bundle manifest
        run: node scripts/bundle-diff.cjs --base dist/assets > release-notes-bundle.md || true

      - name: Generate changelog section for this tag
        run: node scripts/changelog.cjs --tag "${{ github.ref_name }}" > release-notes.md

      - name: Zip the bundle
        run: |
          cd dist
          zip -r "../arise-${{ github.ref_name }}-dist.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            arise-${{ github.ref_name }}-dist.zip
          fail_on_unmatched_files: true
