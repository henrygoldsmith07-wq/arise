<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <!-- CSP mirrors vercel.json for non-Vercel hosts. 'unsafe-inline' script is
         the boot theme/a11y snippet below; style inline covers the boot splash.
         Only the illustration host is allowlisted for images/connect; no
         third-party trackers, fonts or analytics anywhere. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://bryllim.github.io data:; font-src 'self' data:; connect-src 'self' https://bryllim.github.io https://api.github.com https://integrate.api.nvidia.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <script>
      try {
        var raw = localStorage.getItem('arise.store.v1');
        var prefs = raw ? (JSON.parse(raw).preferences || {}) : {};
        var t = prefs.theme;
        // also honour legacy arise.settings if present
        if (!t) { try { t = JSON.parse(localStorage.getItem('arise.settings') || '{}').theme; } catch(e){} }
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        // Accessibility preferences too, so larger text / high contrast are in
        // place on the first paint rather than snapping in once React mounts.
        var a11y = prefs.accessibility || {};
        if (a11y.largeText) document.documentElement.classList.add('large-text');
        if (a11y.highContrast) document.documentElement.classList.add('high-contrast');
        if (a11y.reduceMotion) document.documentElement.classList.add('reduce-motion');
      } catch(e) {}
    </script>
    <title>Arise — Training, levelled up</title>
    <meta name="description" content="Arise is a game-like training companion: browse exercises, follow scheduled programs, log resistance & volume, and watch attributes grow from real history. Offline-first, no account needed." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/logo.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arise" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/splash-dark-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/splash-light-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="/splash-dark-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="/splash-light-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/splash-dark-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/splash-light-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/splash-dark-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/splash-light-1170x2532.png" />
    <style>
      #root .boot{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px}
      #root .spin{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(128,128,128,.25);border-top-color:currentColor;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      html.dark body{background:#0b0b0d;color:#f4f4f5} html:not(.dark) body{background:#f4f4f6;color:#131316}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><div style="width:64px;height:64px;border-radius:18px;background:#131316;display:grid;place-items:center;color:white;font-weight:900;font-size:28px">A</div><h1 style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0">Arise</h1><p style="opacity:.6;font-size:13px;margin:0">Training, levelled up.</p><div class="spin"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
